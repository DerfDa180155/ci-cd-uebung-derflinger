name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.os }}, Java ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['17', '21']
        exclude:
          - os: windows-latest
            java: '17'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Run unit tests
        id: tests
        run: mvn --batch-mode --no-transfer-progress test

      - name: Upload Surefire reports
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-${{ matrix.os }}-java-${{ matrix.java }}
          path: target/surefire-reports/
          if-no-files-found: error

      # Maven stops before the lifecycle-bound report if a unit test fails.
      - name: Generate JaCoCo report after failed tests
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && matrix.java == '17' && steps.tests.outcome == 'failure' }}
        run: mvn --batch-mode --no-transfer-progress jacoco:report

      - name: Upload JaCoCo coverage XML
        id: coverage
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && matrix.java == '17' && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-xml
          path: target/site/jacoco/jacoco.xml
          if-no-files-found: error

      - name: Analyze with SonarQube Cloud
        if: ${{ !cancelled() && github.event_name == 'push' && steps.coverage.outcome == 'success' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          mvn --batch-mode --no-transfer-progress
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.9.0.7382:sonar
          -Dsonar.java.jdkHome="$JAVA_HOME"
